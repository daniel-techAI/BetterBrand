<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">R/CREATION wordmark</title>
  <desc id="desc">R Creation in warm white and muted gold on black.</desc>
  <rect width="1600" height="480" fill="#090909"/>
  <rect x="24" y="24" width="1552" height="432" fill="none" stroke="#c8aa68" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="500">
    <text x="275" y="292" fill="#f4f2ed" font-size="164">R</text>
    <text x="420" y="292" fill="#c8aa68" font-size="164">/</text>
    <text x="500" y="292" fill="#f4f2ed" font-size="164">CREATION</text>
  </g>
  <line x1="276" y1="342" x2="1324" y2="342" stroke="#c8aa68" stroke-width="3"/>
</svg>
